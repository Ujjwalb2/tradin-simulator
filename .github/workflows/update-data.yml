name: Update market data

# Adds the newest days to every ticker once a day and pushes them, so the published dashboard
# stays current on its own. 05:30 UTC (11:00 IST) is after the previous day has closed
# everywhere and after Dukascopy, Upstox and Binance publish it. Run it by hand any time
# from the Actions tab; raise "days" there to redo a longer tail after an outage.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days of the tail to rebuild'
        default: '7'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pandas numpy certifi

      # The raw downloads (Dukascopy .bi5 days, Upstox months) are not in the repository, so
      # they are cached between runs. The update only needs the last few days either way; the
      # cache just saves re-fetching the days a previous run already has.
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Reads the bars already in replay/data, rebuilds only the last few days on top of them
      # and rewrites the tail. A full rebuild would mean ~4,200 Dukascopy day files, which
      # that feed is far too rate-limited to serve inside this job.
      - name: Top up every ticker
        id: update
        timeout-minutes: 20
        env:
          DAYS: ${{ inputs.days || '7' }}
        run: python src/update_replay.py --days "$DAYS"

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      # Runs even when the update failed: one ticker may have been topped up before the other
      # failed, and that ticker's new bars are still worth publishing.
      - name: Commit new bars
        if: always() && steps.update.outcome != 'cancelled'
        run: |
          python src/update_replay.py --verify   # never publish files that do not read back
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replay/data
          if git diff --cached --quiet; then
            echo "No new bars to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
            echo "Published new bars." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib
          print("| ticker | 5m bars | last bar |")
          print("|---|---|---|")
          for meta in sorted(pathlib.Path("replay/data").glob("*/meta.json")):
              m = json.loads(meta.read_text())
              print(f"| {m['symbol']} | {m['tfs']['5m']['n']:,} | {m['last']} |")
          PY
